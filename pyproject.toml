[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocidiff"
dynamic = ["version"]
description = "Diff two Docker images straight from the registry, without pulling them"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HER1Nx" }]
keywords = ["docker", "oci", "registry", "diff", "containers", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.28",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/HER1Nx/ocidiff"
Source = "https://github.com/HER1Nx/ocidiff"
Issues = "https://github.com/HER1Nx/ocidiff/issues"

[project.scripts]
ocidiff = "ocidiff.cli:main"

[tool.hatch.version]
path = "src/ocidiff/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ocidiff"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
