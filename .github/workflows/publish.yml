# Publishes to PyPI when a GitHub release is created.
# Uses Trusted Publishing, so there is no API token to store: PyPI is configured to
# trust this repository and workflow, and GitHub proves the identity at run time.
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
